# Push to main => test, build Docker image, push to GHCR, deploy to VPS.
#
# Repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   VPS_HOST       VPS IP or hostname
#   VPS_USER       SSH user on the VPS (must be in the `docker` group)
#   VPS_SSH_KEY    private key for that user (content of id_ed25519)
#   VPS_PORT       optional, default 22
#   VPS_APP_DIR    optional, default /opt/uppm
# Repository variables (Variables tab), baked into the frontend bundle:
#   VITE_TURNSTILE_SITE_KEY, VITE_APP_URL, VITE_GEMINI_API_KEY (optional)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_lc: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile runs typecheck + tests + build; a failure stops the deploy.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VITE_GEMINI_API_KEY=${{ vars.VITE_GEMINI_API_KEY }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and backup scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml,deploy/backup.sh,deploy/restore.sh
          target: ${{ secrets.VPS_APP_DIR || '/opt/uppm' }}

      - name: Pull and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ needs.build.outputs.image_lc }}:${{ github.sha }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/uppm' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE,APP_DIR
          script: |
            set -e
            cd "$APP_DIR"
            if [ ! -f .env ]; then echo "Missing $APP_DIR/.env (copy from .env.docker.example)"; exit 1; fi
            install -m 700 deploy/backup.sh backup.sh
            install -m 700 deploy/restore.sh restore.sh
            # Versioned backup before every deploy: roll back with ./restore.sh list / ./restore.sh <name> --with-app
            ./backup.sh pre-deploy
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE
            docker compose pull app
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            healthy=no
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
              if [ "$status" = healthy ]; then healthy=yes; break; fi
              sleep 5
            done
            if [ "$healthy" != yes ]; then
              echo "App not healthy"
              docker compose logs --tail=100 app
              exit 1
            fi
            echo "App healthy"
            docker image prune -f
